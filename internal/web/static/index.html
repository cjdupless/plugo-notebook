<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plugo — Go-Native Notebook</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300ADD8'/%3E%3Cpath d='M10 9h7a5 5 0 0 1 0 10h-3v4h-4V9zm4 3.5v3h3a1.5 1.5 0 0 0 0-3h-3z' fill='%2308121a'/%3E%3Ccircle cx='23' cy='22' r='2.5' fill='%2308121a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Header / Toolbar -->
    <header class="topbar">
      <div class="topbar-left">
        <button id="btn-toggle-sidebar" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>

        <div class="brand">
          <svg class="brand-mark" width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="var(--accent)"/>
            <path d="M9.5 8.5h7.2a5.2 5.2 0 0 1 0 10.4H13.5V23.5h-4V8.5zm4 3.5v3.4h3a1.7 1.7 0 0 0 0-3.4h-3z" fill="#07131c"/>
            <circle cx="22.8" cy="21.8" r="2.6" fill="#07131c"/>
          </svg>
          <span class="brand-name">Plugo</span>
        </div>

        <span class="divider-v"></span>

        <input id="notebook-title" class="title-input" type="text" value="Loading..." aria-label="Notebook title" spellcheck="false" />
        <span id="save-status" class="save-badge" title="Auto-save status">Saved</span>
      </div>

      <div class="topbar-actions">
        <button id="btn-run-all" class="btn btn-primary" title="Run all cells (Shift+Alt+Enter)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l11 8-11 8V4zm13 0h2v16h-2V4z"/></svg>
          <span>Run All</span>
        </button>
        <button id="btn-add-code" class="btn btn-subtle" title="Add Go code cell at bottom">
          <span class="dot dot-go"></span> + Go
        </button>
        <button id="btn-add-md" class="btn btn-subtle" title="Add Markdown cell at bottom">
          <span class="dot dot-md"></span> + Markdown
        </button>
        <button id="btn-format-all" class="btn btn-subtle" title="Format all Go cells with gofmt">
          gofmt
        </button>
        <button id="btn-export-go" class="btn btn-subtle" title="Export notebook as a single .go file">
          Export .go
        </button>
        <button id="btn-clear-outputs" class="icon-btn" title="Clear all outputs" aria-label="Clear all outputs">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
        </button>
        <button id="btn-shortcuts" class="icon-btn" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
        <button id="btn-theme" class="icon-btn" title="Toggle light/dark theme" aria-label="Toggle theme">
          <svg id="icon-theme" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <span id="go-version-pill" class="version-pill" title="Local Go toolchain">go</span>
      </div>
    </header>

    <div class="workspace">
      <!-- Left Sidebar: Notebooks + Shared Go Package Scope -->
      <aside id="sidebar" class="sidebar">
        <section class="sidebar-section">
          <div class="sidebar-header">
            <h2>Notebooks</h2>
            <button id="btn-new-notebook" class="btn-mini" title="Create new notebook">+ New</button>
          </div>
          <ul id="notebook-list" class="notebook-list"></ul>
        </section>

        <section class="sidebar-section sidebar-scope">
          <div class="sidebar-header">
            <h2>Shared Go Scope</h2>
            <span id="scope-count" class="count-pill">0</span>
          </div>
          <p class="sidebar-hint">Top-level <code>type</code>, <code>func</code>, <code>const</code>, <code>var</code>, and <code>import</code> symbols shared across cells.</p>
          <ul id="scope-list" class="scope-list"></ul>
        </section>
      </aside>

      <!-- Main Notebook Canvas -->
      <main class="notebook-main">
        <div id="cells-container" class="cells-container"></div>

        <div class="bottom-add-bar">
          <button id="btn-bottom-code" class="btn btn-subtle">
            <span class="dot dot-go"></span> + Add Go Cell
          </button>
          <button id="btn-bottom-md" class="btn btn-subtle">
            <span class="dot dot-md"></span> + Add Markdown Cell
          </button>
        </div>
      </main>
    </div>
  </div>

  <!-- Export / Inspect Modal -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Export Go Source</h3>
        <div class="modal-header-actions">
          <button id="btn-modal-copy" class="btn btn-subtle">Copy</button>
          <a id="btn-modal-download" class="btn btn-primary hidden" download>Download .go</a>
          <button id="btn-modal-close" class="icon-btn" aria-label="Close modal">✕</button>
        </div>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
